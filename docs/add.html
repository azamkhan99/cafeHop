<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fdfbf8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>The Cup Schema - Azam's NYC Coffee Dataset</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="chrome.css?v=13">
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
    <style>
        :root {
            --schema-bg: #fdfbf8;
            --schema-surface: #ffffff;
            --schema-bg-secondary: #f5ede3;
            --schema-text-primary: #1f1b16;
            --schema-text-secondary: #5e564d;
            --schema-border-secondary: rgba(44, 26, 14, 0.1);
            --schema-border-tertiary: rgba(44, 26, 14, 0.08);
            --schema-accent: #a37b55;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--schema-bg);
            padding: 0;
            margin: 0;
            color: var(--schema-text-primary);
        }

        /* Match map: fill iOS Safari visual viewport so no band below fixed chrome */
        body.has-chrome[data-chrome-page="add"] {
            min-height: 100vh;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
        }

        .content-wrapper.add-content {
            padding: 1.25rem max(1.25rem, env(safe-area-inset-left)) 1.5rem max(1.25rem, env(safe-area-inset-right));
        }

        .form-container.add-clean-inner {
            max-width: 420px;
            margin: 0 auto;
            padding: 0;
        }

        .add-main {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .add-photo-block {
            position: relative;
        }

        .add-photo-input {
            position: absolute;
            width: 0.01px;
            height: 0.01px;
            opacity: 0;
            overflow: hidden;
            z-index: -1;
        }

        .add-photo-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            min-height: 200px;
            padding: 1.5rem 1rem;
            border-radius: 16px;
            border: 1px dashed rgba(163, 123, 85, 0.45);
            background: rgba(255, 255, 255, 0.35);
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
            text-align: center;
        }

        .add-photo-label:hover {
            border-color: var(--schema-accent);
            background: rgba(255, 255, 255, 0.55);
        }

        .add-photo-label-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9375rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--schema-text-primary);
        }

        .add-photo-label-hint {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            color: var(--schema-text-secondary);
        }

        .add-file-preview {
            margin-top: 1rem;
            text-align: center;
        }

        .add-file-preview img {
            max-width: 100%;
            max-height: 240px;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
        }

        .add-name-block {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .add-name-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--schema-text-secondary);
        }

        .add-name-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid rgba(163, 123, 85, 0.55);
            background: transparent;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--schema-text-primary);
            padding: 0.5rem 0 0.65rem;
            outline: none;
            border-radius: 0;
        }

        .add-name-input::placeholder {
            color: rgba(94, 86, 77, 0.35);
        }

        .add-name-input:focus {
            border-bottom-color: var(--schema-accent);
        }

        .add-log-btn {
            width: 100%;
            margin-top: 0.25rem;
            padding: 0.85rem 1.25rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8125rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: none;
            border-radius: 999px;
            background: var(--schema-text-primary);
            color: var(--schema-bg);
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .add-log-btn:hover {
            opacity: 0.92;
        }

        .add-log-btn:active {
            transform: scale(0.99);
        }

        .add-log-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .comparison-wrap-inner {
            margin-top: 1.75rem;
        }

        .comparison-wrap-inner:not(:has(.comparison-section.active)) {
            display: none;
        }

        /* Password modal (opened from Log café) */
        .password-modal {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .password-modal.is-open {
            pointer-events: auto;
            opacity: 1;
            visibility: visible;
        }

        .password-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(31, 27, 22, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .password-modal-panel {
            position: relative;
            width: 100%;
            max-width: 340px;
            padding: 1.35rem 1.35rem 1.25rem;
            border-radius: 14px;
            background: var(--schema-bg);
            border: 1px solid var(--schema-accent);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .password-modal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--schema-text-primary);
            margin: 0 0 0.35rem;
        }

        .password-modal-sub {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8125rem;
            color: var(--schema-text-secondary);
            margin: 0 0 1.1rem;
            line-height: 1.4;
        }

        .password-modal-field {
            margin-bottom: 0;
        }

        .password-modal-field .password-wrapper {
            position: relative;
        }

        .password-modal-field input[type="password"] {
            width: 100%;
            padding: 0.7rem 2.75rem 0.7rem 0.85rem;
            border: 1px solid var(--schema-border-secondary);
            border-radius: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.65);
            color: var(--schema-text-primary);
        }

        .password-modal-field input[type="password"]:focus {
            outline: none;
            border-color: var(--schema-accent);
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--schema-text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.25rem 0.5rem;
            z-index: 10;
        }

        .password-modal-actions {
            display: flex;
            gap: 0.65rem;
            margin-top: 1.15rem;
            justify-content: flex-end;
        }

        .password-modal-cancel,
        .password-modal-confirm {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.55rem 1rem;
            border-radius: 999px;
            cursor: pointer;
            border: 1px solid var(--schema-border-secondary);
            background: transparent;
            color: var(--schema-text-secondary);
        }

        .password-modal-confirm {
            background: var(--schema-text-primary);
            color: var(--schema-bg);
            border-color: var(--schema-text-primary);
        }

        .password-modal-cancel:hover,
        .password-modal-confirm:hover {
            opacity: 0.9;
        }

        .file-name {
            margin-top: 0.5rem;
            color: var(--schema-text-secondary);
            font-size: 0.9rem;
        }

        .comparison-section {
            display: none;
            margin-top: 2rem;
        }

        .comparison-section.active {
            display: block;
        }

        .comparison-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .comparison-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.87);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .comparison-header p {
            color: rgba(0, 0, 0, 0.6);
            font-size: 0.875rem;
            font-family: 'Roboto', sans-serif;
        }

        .comparison-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 1rem;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .comparison-cafe {
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 1.5rem;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 150px;
        }

        .comparison-cafe:hover {
            border-color: rgba(0, 0, 0, 0.2);
            background-color: rgba(0, 0, 0, 0.02);
        }

        .comparison-cafe:active {
            border-color: rgba(0, 0, 0, 0.4);
        }

        .comparison-cafe-name {
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            color: rgba(0, 0, 0, 0.87);
            margin-bottom: 0.5rem;
        }

        .comparison-cafe-neighborhood {
            font-family: 'Roboto', sans-serif;
            color: rgba(0, 0, 0, 0.6);
            font-size: 0.875rem;
        }

        .comparison-or {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: white;
            flex-shrink: 0;
        }


        .comparison-progress {
            text-align: center;
            margin-top: 1rem;
            font-family: 'Roboto', sans-serif;
            color: rgba(0, 0, 0, 0.6);
            font-size: 0.875rem;
        }

        .comparison-cant-decide {
            width: 100%;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 2px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.0892857143em;
            background-color: white;
            color: rgba(0, 0, 0, 0.6);
        }

        .comparison-cant-decide:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .comparison-loading {
            text-align: center;
            padding: 2rem;
            font-family: 'Roboto', sans-serif;
            color: rgba(0, 0, 0, 0.6);
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid rgba(0, 0, 0, 0.87);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .upload-status {
            text-align: center;
            padding: 2rem;
        }

        .upload-status h3 {
            font-family: 'Space Grotesk', sans-serif;
            margin-top: 1rem;
            color: rgba(0, 0, 0, 0.87);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 1rem;
        }

        .upload-status p {
            font-family: 'Roboto', sans-serif;
            color: rgba(0, 0, 0, 0.6);
        }

        @media (max-width: 480px) {
            .comparison-container {
                grid-template-columns: 1fr;
                gap: 1rem;
                padding: 0.75rem;
            }

            .comparison-vs {
                display: none;
            }

            .comparison-cafe {
                padding: 1rem;
                min-height: 120px;
            }

            .comparison-cafe-name {
                font-size: 0.9rem;
            }

            .comparison-cafe-neighborhood {
                font-size: 0.75rem;
            }

            .comparison-or {
                width: 35px;
                height: 35px;
                font-size: 0.65rem;
                margin: 0 auto;
                grid-column: 1;
            }
        }

        @media (max-width: 768px) and (min-width: 481px) {
            .comparison-container {
                gap: 0.75rem;
                padding: 1rem;
            }

            .comparison-cafe {
                padding: 1.25rem;
                min-height: 140px;
            }

            .comparison-cafe-name {
                font-size: 0.95rem;
            }

            .comparison-or {
                width: 38px;
                height: 38px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 768px) {
            .content-wrapper.add-content {
                padding: 1rem max(1rem, env(safe-area-inset-left)) 1.25rem max(1rem, env(safe-area-inset-right));
            }

            .add-photo-label {
                min-height: 180px;
            }
        }
    </style>
</head>

<body class="has-chrome" data-chrome-page="add">
    <header class="chrome-header">
        <div class="chrome-header-inner">
            <a href="index.html" class="chrome-brand">Cup <span class="chrome-brand-accent">Schema</span></a>
        </div>
    </header>

    <div class="content-wrapper add-content">
        <div class="form-container add-clean-inner">
            <form id="cafe-form">
                <div id="add-main" class="add-main">
                    <div class="add-photo-block">
                        <input type="file" accept="image/*" id="photo" class="add-photo-input" required />
                        <label for="photo" class="add-photo-label">
                            <span class="add-photo-label-title">Choose a photo</span>
                            <span class="add-photo-label-hint">JPEG, PNG, or HEIC</span>
                        </label>
                        <div class="add-file-preview" id="file-preview"></div>
                    </div>
                    <div class="add-name-block">
                        <label for="cafe" class="add-name-label">Café name</label>
                        <input type="text" id="cafe" class="add-name-input" placeholder="Name" autocomplete="off"
                            required />
                    </div>
                    <button type="button" class="add-log-btn" id="submit-btn">Log café</button>
                </div>
            </form>
            <div class="comparison-wrap-inner">
                <div class="comparison-section" id="comparison-section">
                    <div class="comparison-header">
                        <h2>Which do you prefer?</h2>
                    </div>
                    <div id="comparison-content">
                        <div class="comparison-loading">Loading cafes for comparison...</div>
                    </div>
                    <div class="comparison-progress" id="comparison-progress"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="password-modal" class="password-modal" aria-hidden="true">
        <div class="password-modal-backdrop" id="password-modal-backdrop" tabindex="-1"></div>
        <div class="password-modal-panel" role="dialog" aria-modal="true" aria-labelledby="pwd-modal-title">
            <h2 id="pwd-modal-title" class="password-modal-title">Upload password</h2>
            <p class="password-modal-sub">Required to log this café.</p>
            <div class="password-modal-field">
                <div class="password-wrapper">
                    <input type="password" id="upload-password" placeholder="Password" autocomplete="current-password" />
                    <button type="button" class="password-toggle" id="password-toggle"
                        aria-label="Toggle password visibility">
                        <span id="toggle-icon">👁️</span>
                    </button>
                </div>
            </div>
            <div class="password-modal-actions">
                <button type="button" class="password-modal-cancel" id="password-modal-cancel">Cancel</button>
                <button type="button" class="password-modal-confirm" id="password-modal-confirm">Continue</button>
            </div>
        </div>
    </div>

    <script src="chrome.js?v=11"></script>
    <script src="api-config.js"></script>
    <script>
        const C = window.CafeHopConfig || {};
        const AUTH_LAMBDA_URL = C.authUrl || '';
        const IMAGE_SERVICE_URL = C.imageUrl || '';
        const CAFE_URL = C.cafeUrl || '';
        const BUCKET_URL = C.bucketUrl || '';

        let token = null; // Store JWT token in memory
        let storedOriginalFile = null; // Store original file for GPS extraction
        let storedJpgFile = null; // Store converted JPG file for upload
        let storedFormData = null; // Store form data for later upload
        let comparisonResults = []; // Store comparison results
        let currentComparisonIndex = 0;
        let comparisonCafes = []; // Store cafes to compare against

        let watchlistPrefill = null;
        (function loadWatchlistPrefill() {
            const params = new URLSearchParams(location.search);
            const id = params.get('watchlist');
            if (!id || !window.CafeHopWatchlist) return;
            const apply = function (item) {
                watchlistPrefill = item;
                if (watchlistPrefill && watchlistPrefill.name) {
                    const nameEl = document.getElementById('cafe');
                    if (nameEl && !nameEl.value) nameEl.value = watchlistPrefill.name;
                }
            };
            const existing = window.CafeHopWatchlist.getById(id);
            if (existing) {
                apply(existing);
                return;
            }
            window.CafeHopWatchlist.refresh().then(function () {
                apply(window.CafeHopWatchlist.getById(id));
            });
        })();

        function resolveGps(fileGps) {
            if (fileGps && fileGps.latitude != null && fileGps.longitude != null) {
                return fileGps;
            }
            if (watchlistPrefill && watchlistPrefill.lat != null && watchlistPrefill.lng != null) {
                return { latitude: Number(watchlistPrefill.lat), longitude: Number(watchlistPrefill.lng) };
            }
            return null;
        }

        // --- 0. Password toggle functionality ---
        const passwordInput = document.getElementById('upload-password');
        const passwordToggle = document.getElementById('password-toggle');
        const toggleIcon = document.getElementById('toggle-icon');

        passwordToggle.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // --- 1. Preview uploaded image ---
        document.getElementById('photo').addEventListener('change', function (e) {
            const file = e.target.files[0];
            const preview = document.getElementById('file-preview');
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.innerHTML = `
                <img src="${e.target.result}" alt="Preview" />
                <div class="file-name">${file.name}</div>
            `;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '';
            }
        });

        // --- 2. Extract GPS coordinates ---
        function getGPSFromFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = async function (e) {
                    try {
                        const exifData = await exifr.parse(e.target.result, { gps: true });
                        if (exifData && exifData.latitude !== undefined && exifData.longitude !== undefined) {
                            resolve({ latitude: exifData.latitude, longitude: exifData.longitude });
                        } else {
                            resolve(null);
                        }
                    } catch (err) {
                        resolve(null);
                    }
                };
                reader.onerror = () => resolve(null);
                reader.readAsArrayBuffer(file);
            });
        }

        // --- 3. Get JWT token from Auth Lambda ---
        async function getToken(password) {
            const res = await fetch(AUTH_LAMBDA_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password })
            });
            if (!res.ok) throw new Error("Auth failed");
            const data = await res.json();
            return data.token;
        }

        // --- 3. Convert image to JPG with resizing for performance ---
        function convertToJPG(file) {
            return new Promise(async (resolve, reject) => {
                try {
                    // Read file as ArrayBuffer to get EXIF data
                    const arrayBuffer = await new Promise((res, rej) => {
                        const reader = new FileReader();
                        reader.onload = () => res(reader.result);
                        reader.onerror = rej;
                        reader.readAsArrayBuffer(file);
                    });

                    // Get EXIF orientation (only checking for 90° CCW rotation - orientation 6)
                    const exifData = await exifr.parse(arrayBuffer, { orientation: true });
                    const orientation = exifData?.Orientation || 1;
                    const needsRotation = orientation === 6; // 90° counter-clockwise

                    // Create image from array buffer
                    const blob = new Blob([arrayBuffer], { type: file.type });
                    const url = URL.createObjectURL(blob);

                    const img = new Image();
                    img.onload = function () {
                        // Resize to max 800px width for good quality in gallery (250px display height)
                        const MAX_WIDTH = 800;

                        let width = img.width;
                        let height = img.height;

                        // If rotated 90° CCW, swap dimensions for canvas
                        if (needsRotation) {
                            [width, height] = [height, width];
                        }

                        // Resize if larger than max width, maintaining aspect ratio
                        if (width > MAX_WIDTH) {
                            const ratio = MAX_WIDTH / width;
                            width = MAX_WIDTH;
                            height = height * ratio;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');

                        // Use faster rendering settings
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';

                        // Apply rotation if needed (90° counter-clockwise)
                        if (needsRotation) {
                            ctx.save();
                            ctx.translate(width / 2, height / 2);
                            ctx.rotate(-Math.PI / 2); // 90° counter-clockwise
                            ctx.drawImage(img, -img.width / 2, -img.height / 2, img.width, img.height);
                            ctx.restore();
                        } else {
                            // Normal orientation - just draw the image
                            ctx.drawImage(img, 0, 0, width, height);
                        }

                        // Clean up object URL
                        URL.revokeObjectURL(url);

                        // Use 85% quality for good balance
                        canvas.toBlob(function (blob) {
                            if (blob) {
                                // Create a new File object with .jpg extension
                                const jpgFile = new File([blob], file.name.replace(/\.[^/.]+$/, '.jpg'), {
                                    type: 'image/jpeg',
                                    lastModified: Date.now()
                                });
                                resolve(jpgFile);
                            } else {
                                reject(new Error('Failed to convert image to JPG'));
                            }
                        }, 'image/jpeg', 0.85);
                    };
                    img.onerror = () => {
                        URL.revokeObjectURL(url);
                        reject(new Error('Failed to load image'));
                    };
                    img.src = url;
                } catch (error) {
                    reject(new Error('Failed to process image: ' + error.message));
                }
            });
        }

        // --- 4. Get presigned URL ---
        async function getPresignedUrl(uploadData) {
            try {
                const res = await fetch(IMAGE_SERVICE_URL + "/presigned-url", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(uploadData)
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    let errorMessage = "Failed to get presigned URL";
                    try {
                        const errorData = JSON.parse(errorText);
                        errorMessage = errorData.error || errorMessage;
                    } catch (e) {
                        errorMessage = errorText || errorMessage;
                    }

                    if (res.status === 401) {
                        errorMessage = "Authentication failed. Please try again.";
                        token = null; // Clear invalid token
                    } else if (res.status === 403) {
                        errorMessage = "Access denied. Please check your credentials.";
                    } else if (res.status === 0) {
                        errorMessage = "Network error. Please check your connection and CORS settings.";
                    }

                    throw new Error(errorMessage + ` (Status: ${res.status})`);
                }

                return await res.json();
            } catch (error) {
                if (error.message.includes("Failed to fetch") || error.message.includes("Network error")) {
                    throw new Error("Network error: Could not connect to server. Please check:\n1. Your internet connection\n2. CORS settings on the Lambda function\n3. The Lambda function URL is correct");
                }
                throw error;
            }
        }

        // --- 5. Fetch random cafes for comparison (from ranking service) ---
        async function fetchRandomCafes(numCafes = 5) {
            try {
                const url = `${CAFE_URL}/ranking/cafes?limit=${numCafes}`;
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Failed to fetch cafes: ${response.status}`);
                }
                const data = await response.json();
                return data.cafes || [];
            } catch (error) {
                console.error('Error fetching cafes for comparison:', error);
                return [];
            }
        }

        // --- 6. Display comparison UI ---
        function displayComparison(newCafeName, newCafeNeighborhood, existingCafe) {
            const content = document.getElementById('comparison-content');
            const progress = document.getElementById('comparison-progress');

            const newCafeNeighborhoodHtml = newCafeNeighborhood ?
                `<div class="comparison-cafe-neighborhood">${newCafeNeighborhood}</div>` : '';
            const existingCafeNeighborhoodHtml = existingCafe.neighborhood ?
                `<div class="comparison-cafe-neighborhood">${existingCafe.neighborhood}</div>` : '';

            // Escape HTML special characters to prevent XSS
            const escapeHtml = (text) => {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            };

            const escapedKey = escapeHtml(existingCafe.key);
            const escapedNewCafeName = escapeHtml(newCafeName);
            const escapedExistingCafeName = escapeHtml(existingCafe.name);

            content.innerHTML = `
                <div class="comparison-container" id="comparison-container">
                    <div class="comparison-cafe" id="new-cafe-card" data-cafe-key="${escapedKey}" data-score="1">
                        <div class="comparison-cafe-name">${escapedNewCafeName}</div>
                        ${newCafeNeighborhoodHtml}
                    </div>
                    <div class="comparison-or">OR</div>
                    <div class="comparison-cafe" id="existing-cafe-card" data-cafe-key="${escapedKey}" data-score="0">
                        <div class="comparison-cafe-name">${escapedExistingCafeName}</div>
                        ${existingCafeNeighborhoodHtml}
                    </div>
                </div>
                <button class="comparison-cant-decide" data-cafe-key="${escapedKey}" data-score="0.5">
                    I can't decide
                </button>
            `;

            progress.textContent = `Comparison ${currentComparisonIndex + 1} of ${comparisonCafes.length}`;

            // Attach event listeners instead of using inline onclick
            document.getElementById('new-cafe-card').addEventListener('click', function () {
                handleComparison(1, existingCafe.key);
            });
            document.getElementById('existing-cafe-card').addEventListener('click', function () {
                handleComparison(0, existingCafe.key);
            });
            document.querySelector('.comparison-cant-decide').addEventListener('click', function () {
                handleComparison(0.5, existingCafe.key);
            });
        }


        // --- 7. Handle comparison selection ---
        window.handleComparison = function (score, cafeKey) {
            comparisonResults.push([cafeKey, score]);
            currentComparisonIndex++;

            if (currentComparisonIndex < comparisonCafes.length) {
                // Show next comparison
                const newCafeName = document.getElementById('cafe').value.trim();

                // Get neighborhood for new cafe (if available from stored data)
                const newCafeNeighborhood = storedFormData?.neighborhood || null;

                displayComparison(
                    newCafeName,
                    newCafeNeighborhood,
                    comparisonCafes[currentComparisonIndex]
                );
            } else {
                // All comparisons done, show loading spinner and proceed with upload
                const content = document.getElementById('comparison-content');
                const progress = document.getElementById('comparison-progress');
                content.innerHTML = `
                    <div class="upload-status">
                        <div class="spinner"></div>
                        <h3>Logging café...</h3>
                    </div>
                `;
                progress.textContent = '';
                proceedWithUpload();
            }
        };

        // --- 8. Proceed with upload after comparisons ---
        async function proceedWithUpload() {
            // Loading spinner is already shown by handleComparison if coming from comparisons
            // If called directly (no cafes to compare), show spinner now
            if (comparisonCafes.length === 0) {
                const content = document.getElementById('comparison-content');
                content.innerHTML = `
                    <div class="upload-status">
                        <div class="spinner"></div>
                        <h3>Uploading your café...</h3>
                        <p style="color: #718096; margin-top: 0.5rem;">Please wait while we process your upload</p>
                    </div>
                `;
            }

            try {
                // Use stored data
                const jpgFile = storedJpgFile;
                const originalFile = storedOriginalFile || document.getElementById("photo").files[0];
                const cafeName = storedFormData?.cafeName || document.getElementById("cafe").value.trim();
                const notes = '';
                const password = storedFormData?.password || document.getElementById("upload-password").value;

                if (!jpgFile) {
                    throw new Error("Converted image not found. Please try uploading again.");
                }

                // --- 1 & 2. Get token and extract GPS in parallel (both are independent) ---
                const [tokenResult, fileGps] = await Promise.all([
                    // Get token if not already, or refresh if expired
                    (async () => {
                        if (!token) {
                            return await getToken(password);
                        } else {
                            // Token might have expired during comparisons (tokens are valid for 5 minutes)
                            // Try to refresh it if we have the password
                            try {
                                // Simple check: if token exists but might be old, refresh it
                                // Since tokens expire in 5 minutes and comparisons might take longer, refresh proactively
                                return await getToken(password);
                            } catch (err) {
                                // If refresh fails, try to continue with existing token
                                return token;
                            }
                        }
                    })(),
                    // Extract GPS from original file
                    originalFile ? getGPSFromFile(originalFile) : Promise.resolve(null)
                ]);
                token = tokenResult;
                const gpsData = resolveGps(fileGps);

                // --- 4. Get presigned URL with comparison results ---
                // Use the file's actual content type (could be JPG, HEIC, etc.)
                const uploadData = {
                    contentType: jpgFile.type || 'image/jpeg',
                    cafeName,
                    notes,
                    latitude: gpsData ? gpsData.latitude : null,
                    longitude: gpsData ? gpsData.longitude : null,
                    comparisons: comparisonResults
                };
                const { uploadUrl, s3Key } = await getPresignedUrl(uploadData);

                // --- 5. Upload file to S3 ---
                const uploadRes = await fetch(uploadUrl, {
                    method: "PUT",
                    headers: { "Content-Type": jpgFile.type || "image/jpeg" },
                    body: jpgFile
                });
                if (!uploadRes.ok) throw new Error("Failed to upload to S3");

                // --- 6. Thumbnail (image) + register cafe (cafe API) in parallel ---
                const processPromise = fetch(IMAGE_SERVICE_URL + "/process", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ s3Key: s3Key })
                });
                const fromUploadPromise = CAFE_URL ? fetch(CAFE_URL + "/v1/cafes/from-upload", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        s3Key: s3Key,
                        cafeName: cafeName,
                        latitude: gpsData ? gpsData.latitude : null,
                        longitude: gpsData ? gpsData.longitude : null,
                        notes: notes,
                        comparisons: comparisonResults
                    })
                }) : Promise.resolve(null);
                const [processRes, fromUploadRes] = await Promise.all([processPromise, fromUploadPromise]);
                if (processRes && !processRes.ok) {
                    const detail = await processRes.text();
                    throw new Error("Thumbnail step failed (" + processRes.status + "): " + detail);
                }
                if (fromUploadRes && !fromUploadRes.ok) {
                    const detail = await fromUploadRes.text();
                    throw new Error("Cafe registration failed (" + fromUploadRes.status + "): " + detail);
                }

                alert("Uploaded successfully!");
                if (watchlistPrefill && window.CafeHopWatchlist) {
                    window.CafeHopWatchlist.removeById(watchlistPrefill.id);
                }
                document.getElementById('cafe-form').reset();
                document.getElementById('add-main').style.display = 'flex';
                const pwdEl = document.getElementById('upload-password');
                if (pwdEl) pwdEl.value = '';
                closePasswordModal();
                document.getElementById('file-preview').innerHTML = '';
                document.getElementById('comparison-section').classList.remove('active');
                document.getElementById('comparison-content').innerHTML = '<div class="comparison-loading">Loading cafes for comparison...</div>';
                comparisonResults = [];
                currentComparisonIndex = 0;
                comparisonCafes = [];
                storedOriginalFile = null;
                storedJpgFile = null;
                storedFormData = null;
                token = null;

            } catch (error) {
                alert("Upload error: " + error.message);
                token = null;
            } finally {
                const btn = document.getElementById('submit-btn');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'Log café';
                }
            }
        }

        const passwordModalEl = document.getElementById('password-modal');

        function openPasswordModal() {
            if (!passwordModalEl) return;
            passwordModalEl.classList.add('is-open');
            passwordModalEl.setAttribute('aria-hidden', 'false');
            const pwd = document.getElementById('upload-password');
            if (pwd) {
                pwd.value = '';
                setTimeout(function () { pwd.focus(); }, 40);
            }
        }

        function closePasswordModal() {
            if (!passwordModalEl) return;
            passwordModalEl.classList.remove('is-open');
            passwordModalEl.setAttribute('aria-hidden', 'true');
        }

        (function bindPasswordModalChrome() {
            const bd = document.getElementById('password-modal-backdrop');
            const cancel = document.getElementById('password-modal-cancel');
            const pwdInput = document.getElementById('upload-password');
            if (bd) bd.addEventListener('click', closePasswordModal);
            if (cancel) cancel.addEventListener('click', closePasswordModal);
            if (pwdInput) {
                pwdInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        document.getElementById('password-modal-confirm').click();
                    }
                });
            }
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && passwordModalEl && passwordModalEl.classList.contains('is-open')) {
                    closePasswordModal();
                }
            });
        })();

        document.getElementById('cafe-form').addEventListener('submit', function (e) {
            e.preventDefault();
        });

        document.getElementById('submit-btn').addEventListener('click', function () {
            const file = document.getElementById('photo').files[0];
            const cafeName = document.getElementById('cafe').value.trim();
            if (!file || !cafeName) {
                alert('Please add a photo and a café name.');
                return;
            }
            openPasswordModal();
        });

        document.getElementById('password-modal-confirm').addEventListener('click', async function () {
            const password = document.getElementById('upload-password').value.trim();
            if (!password) {
                alert('Please enter the upload password.');
                return;
            }
            closePasswordModal();

            const file = document.getElementById('photo').files[0];
            const submitBtn = document.getElementById('submit-btn');
            const cafeName = document.getElementById('cafe').value.trim();

            storedOriginalFile = file;
            const gpsData = resolveGps(await getGPSFromFile(file));
            let neighborhood = null;
            storedFormData = {
                cafeName: cafeName,
                password: password,
                neighborhood: neighborhood
            };

            submitBtn.disabled = true;
            submitBtn.textContent = 'Converting image...';

            try {
                if (!token) {
                    token = await getToken(password);
                }

                try {
                    storedJpgFile = await convertToJPG(file);
                } catch (conversionError) {
                    const fileName = file.name.toLowerCase();
                    const isHeic = file.type === 'image/heic' || file.type === 'image/heif' ||
                        fileName.endsWith('.heic') || fileName.endsWith('.heif');

                    if (file.type === 'image/jpeg' || file.type === 'image/jpg') {
                        storedJpgFile = file;
                    } else if (isHeic) {
                        alert(
                            'Could not convert this HEIC photo in your browser.\n\n' +
                            'Fix: open this page in Safari (Mac/iPhone), or in Photos use Share → Save as JPEG, then upload that file.'
                        );
                        throw conversionError;
                    } else {
                        alert('Failed to process image: ' + conversionError.message + '\n\nPlease try selecting a different image file (JPG, PNG, or HEIC).');
                        throw conversionError;
                    }
                }

                submitBtn.textContent = 'Loading comparisons...';
                comparisonCafes = await fetchRandomCafes(5);
                currentComparisonIndex = 0;
                comparisonResults = [];

                if (comparisonCafes.length === 0) {
                    document.getElementById('add-main').style.display = 'none';
                    document.getElementById('comparison-section').classList.add('active');
                    proceedWithUpload();
                    return;
                }

                document.getElementById('add-main').style.display = 'none';
                document.getElementById('comparison-section').classList.add('active');

                displayComparison(
                    cafeName,
                    storedFormData.neighborhood,
                    comparisonCafes[0]
                );

            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log café';
            }
        });

    </script>
